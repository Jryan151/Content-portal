<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal V4</title>
    
    <!-- SCRIPT 1: The Isolated Safety Net -->
    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('grid').innerHTML = `<h3 style="color:red;">Error on line ${line}:<br>${msg}</h3><p>If this says 'SyntaxError', your iPad likely changed standard quotes into curly 'smart quotes' when you pasted the code.</p>`;
            return false;
        };
    </script>
    
    <!-- SCRIPT 2: Supabase Tool -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
        video { border-radius: 8px; width: 100%; background: #000; }
        .btn { flex: 1; padding: 12px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Content Approval Portal V4</h1>
    <div id="grid">
        <h3 id="log">1. HTML Loaded...</h3>
    </div>

    <!-- SCRIPT 3: The Main Engine -->
    <script>
        document.getElementById('log').innerText = "2. JavaScript is running!";
        
        const url = "https://yrhvlrlpdyxgllvshesb.supabase.co";
        const key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyaHZscmxwZHl4Z2xsdnNoZXNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDE5NTQsImV4cCI6MjEwNzE3Nzk1NH0.2HB4QEDU0bl3Jzvsbuq7kzUPc3W5UPpYIFimpGHV8tY";
        
        if (!window.supabase) throw new Error("Supabase tool blocked by Safari content settings.");
        
        const db = window.supabase.createClient(url, key, { auth: { persistSession: false } });
        
        async function loadVideos() {
            document.getElementById('log').innerText = "3. Fetching database...";
            const { data, error } = await db.from('campaigns').select('*').eq('status', 'pending');
            
            if (error) throw new Error(error.message);
            if (!data || data.length === 0) {
                document.getElementById('grid').innerHTML = '<h3>All caught up! No pending videos.</h3>';
                return;
            }

            document.getElementById('grid').innerHTML = ''; 
            data.forEach(v => {
                document.getElementById('grid').innerHTML += `
                    <div class="card">
                        <h3>Target: ${v.target_audience}</h3>
                        <video controls><source src="${v.video_url}" type="video/mp4"></video>
                        <div style="display:flex; gap:10px; margin-top:15px;">
                            <button class="btn" style="background:#2e7d32;" onclick="updateStatus(${v.id}, 'approved')">Approve</button>
                            <button class="btn" style="background:#c62828;" onclick="updateStatus(${v.id}, 'rejected')">Reject</button>
                        </div>
                    </div>
                `;
            });
        }
        
        async function updateStatus(id, newStatus) {
            try {
                await db.from('campaigns').update({ status: newStatus }).eq('id', id);
                loadVideos(); 
            } catch(e) {
                alert("Update failed: " + e.message);
            }
        }

        loadVideos();
    </script>
</body>
</html>
